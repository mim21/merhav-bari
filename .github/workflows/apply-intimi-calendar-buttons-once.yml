name: Apply Intimi calendar buttons once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch published page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'data-subscribe-mode="embed-plus"' not in text:
              header = re.search(r'<div class="header-actions">(?P<body>.*?)</div>', text, re.S)
              if not header:
                  raise SystemExit('header-actions not found')
              body = header.group('body')
              google = re.search(r'<a class="cal-link full-cal-gcal" href="https://calendar\.google\.com/calendar/render\?cid=([^"]+)" target="_blank" rel="noopener noreferrer">📅 Google – הרשם</a>', body)
              if not google:
                  raise SystemExit('real Google subscribe button not found')
              cid = google.group(1)
              legacy = google.group(0).replace('rel="noopener noreferrer"', 'rel="noopener noreferrer" data-subscribe-mode="legacy-render"')
              plus = '<a class="cal-link full-cal-gcal" href="https://calendar.google.com/calendar/r?cid=' + cid + '" target="_blank" rel="noopener noreferrer" data-subscribe-mode="embed-plus" title="+ Google Calendar">➕ Google – הוספה</a>'
              new_body = body.replace(google.group(0), legacy + plus, 1)
              text = text[:header.start('body')] + new_body + text[header.end('body'):]

          marker = 'grid-template-columns: repeat(3, minmax(0, 1fr));'
          if marker not in text:
              mobile = '\n'.join([
                  '    @media (max-width: 600px) {',
                  '      .header-actions {',
                  '        display: grid;',
                  '        grid-template-columns: repeat(3, minmax(0, 1fr));',
                  '        gap: 4px;',
                  '        width: 100%;',
                  '        max-width: 100%;',
                  '      }',
                  '      .header-actions .cal-link {',
                  '        min-width: 0;',
                  '        width: 100%;',
                  '        padding: 7px 3px;',
                  '        font-size: 0.68rem;',
                  '        line-height: 1.15;',
                  '        white-space: nowrap;',
                  '        overflow: hidden;',
                  '        text-overflow: ellipsis;',
                  '      }',
                  '      .cal-embed { height: 220px; overflow: hidden; border-radius: 8px; }',
                  '      .cal-embed iframe { display: block; height: 250px; border-radius: 8px; }',
                  '    }',
                  '',
              ])
              anchor = '    footer { text-align: center;'
              if anchor not in text:
                  raise SystemExit('footer CSS anchor not found')
              text = text.replace(anchor, mobile + anchor, 1)

          header = re.search(r'<div class="header-actions">(?P<body>.*?)</div>', text, re.S)
          assert header and header.group('body').count('<a ') == 3
          assert 'data-subscribe-mode="legacy-render"' in header.group('body')
          assert 'data-subscribe-mode="embed-plus"' in header.group('body')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-intimi-calendar-buttons-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-intimi-calendar-buttons-once.yml
          git commit -m 'Publish Intimi-style calendar buttons'
          git push
